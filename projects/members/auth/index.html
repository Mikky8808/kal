<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Kalani 1.0</title><link rel="icon" href="../assets/images/Logo-leftSM.png"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen min-w-full flex items-center justify-center bg-cover bg-center" style="background-image:url('../assets/images/JMC-Splash.jpg')"><form class="login-card bg-white/90 backdrop-blur-lg rounded-xl shadow-lg max-w-[700px] w-full p-12 flex flex-row items-start gap-12 min-h-[340px] justify-center" onsubmit="return validateLogin()"><div class="logo-side flex flex-col items-center min-w-[200px] max-w-[260px] flex-shrink-0"><div class="logo-container w-[180px] h-[180px] flex justify-center items-center mb-8"><img alt="logo" height="180" src="../assets/images/Logo-leftSM.png" width="180" class="w-[180px] h-[180px] object-contain"/></div><div class="submit-container w-full flex justify-start mt-0"><button type="submit" id="submit-btn" class="bg-[#062c80] text-white font-semibold rounded-lg px-10 py-3 text-lg min-w-[120px] hover:bg-[#3357b9] transition">Submit</button></div></div><div class="login-side flex-1 flex flex-col gap-8 justify-center"><div class="inputs-container w-full flex flex-col gap-8 items-stretch"><div class="inputs-wrapper flex flex-col gap-8 w-full"><div class="w-full"><label for="username" class="block text-gray-500 text-base font-medium mb-1 ml-1">DOB*</label><input autocomplete="off" id="username" placeholder="yyyy-mm-dd" type="text" class="w-full px-5 py-4 border-2 border-gray-300 rounded-lg text-lg bg-gray-50 focus:outline-none focus:border-[#b91c1c] transition placeholder-[#b91c1c]" onfocus="clearError('username')" onblur="showErrorIfEmpty('username')"/><span id="username-error" class="block text-xs font-medium mt-1 ml-1 text-gray-400"></span></div><div class="w-full"><label for="password" class="block text-gray-500 text-base font-medium mb-1 ml-1">Password*</label><div class="relative"><input autocomplete="off" id="password" placeholder="Password" type="password" class="w-full px-5 py-4 border-2 border-gray-300 rounded-lg text-lg bg-gray-50 focus:outline-none focus:border-[#b91c1c] transition placeholder-[#b91c1c]" onfocus="clearError('password')" onblur="showErrorIfEmpty('password')"/><button aria-label="Toggle password visibility" class="toggle-password absolute top-1/2 right-5 -translate-y-1/2 text-gray-500 text-xl" onclick="togglePassword()" type="button"><i class="fas fa-eye" id="toggle-icon"></i></button></div><span id="password-error" class="block text-xs font-medium mt-1 ml-1 text-gray-400"></span></div></div></div><div id="error-msg" class="text-red-600 text-center mt-3 min-h-[20px] text-base"></div></div></form><script src="main.js"></script><script>function clearError(f){document.getElementById(f+'-error').textContent='';document.getElementById(f+'-error').classList.remove('text-red-600');document.getElementById(f+'-error').classList.add('text-gray-400')}function showErrorIfEmpty(f){var i=document.getElementById(f),e=document.getElementById(f+'-error');if(!i.value.trim()){e.textContent=f==='username'?'Please enter your DOB':'Please enter your password';e.classList.remove('text-gray-400');e.classList.add('text-red-600')}else{e.textContent='';e.classList.remove('text-red-600');e.classList.add('text-gray-400')}};</script></body></html>
