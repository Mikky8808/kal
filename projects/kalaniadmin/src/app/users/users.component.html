<jimgcard heading="Kalani Users">
  <button toolbar mat-mini-fab color="primary" (click)="getUserList()">
    <mat-icon>refresh</mat-icon>
  </button>
  <mat-card class="content">
    <mat-card-content class="table-responsive" style="padding: 0px">
      <table mat-table [dataSource]="dataSource" class="tablelist">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>User ID</th>
          <td mat-cell *matCellDef="let element">
            {{ element.username }}
          </td>
        </ng-container>

        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let element">
            {{ element?.first_name }} {{ element?.last_name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let element">
            {{ element?.email }}
          </td>
        </ng-container>
        <ng-container matColumnDef="startPath">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Start Path</th>
          <td mat-cell *matCellDef="let element">
            {{ element?.startPath }}
          </td>
        </ng-container>
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Is Active</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox
              [disabled]="false"
              name = 'isActive'

              color="primary"
              (change)="valueChanged(element,$event)"

              [(ngModel)]="element.isActive"
            ></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="isAdmin">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Is Admin</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox
              name = 'isAdmin'
              (change)="valueChanged(element,$event)"

              [disabled]="false"
              color="primary"
              [(ngModel)]="element.isAdmin"
            ></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="isDriver">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Is Driver</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox
              [disabled]="false"
              (change)="valueChanged(element,$event)"

              name="isDriver"
              color="primary"
              [(ngModel)]="element.isDriver"
            ></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="isPT">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Is PTStaff</th>
          <td mat-cell *matCellDef="let element">

            <mat-checkbox
              [disabled]="false"
              (change)="valueChanged(element,$event)"
              name ='isPT'
              color="primary"
              [(ngModel)]="element.isPT"
            ></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="isLa_Lmt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Is A/LMT</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox
              [disabled]="false"
              (change)="valueChanged(element,$event)"

              name="isLa_Lmt"
              color="primary"
              [(ngModel)]="element.isLa_Lmt"
            ></mat-checkbox>
          </td>
        </ng-container>
        <ng-container matColumnDef="ptColor">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>PT Color</th>
          <!-- <td mat-cell *matCellDef="let element"  [ngStyle]="{'backgroundColor':element.ptColor}"> -->
          <td
            mat-cell
            *matCellDef="let element"
          >
            <input class="fw"
            (change)="valueChanged(element,$event)"
            name="ptColor"
              *ngIf="element.isPT == true"
              type="color"
              value="{{ element.ptColor }}"
            />
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</jimgcard>
