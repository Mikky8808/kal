<jimgcard heading="Kalani Users">
  <button toolbar mat-mini-fab color="primary" (click)="getUserList()">
    <mat-icon>refresh</mat-icon>
  </button>
  <mat-card class="content">
    <mat-card-content class="table-responsive" style="padding: 0px">
      <table mat-table [dataSource]="dataSource" class="tablelist">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Username</th>
          <td mat-cell *matCellDef="let element">{{ element.username }}</td>
        </ng-container>

        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Full Name</th>
          <td mat-cell *matCellDef="let element">{{ element.fullName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let element">{{ element.email }}</td>
        </ng-container>

        <ng-container matColumnDef="startPath">
          <th mat-header-cell *matHeaderCellDef>Start Path</th>
          <td mat-cell *matCellDef="let element">{{ element.startPath }}</td>
        </ng-container>

        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef>Active</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [checked]="element.isActive" disabled></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="isAdmin">
          <th mat-header-cell *matHeaderCellDef>Admin</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [checked]="element.isAdmin" disabled></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="isDriver">
          <th mat-header-cell *matHeaderCellDef>Driver</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [checked]="element.isDriver" disabled></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="isPT">
          <th mat-header-cell *matHeaderCellDef>PT</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [checked]="element.isPT" disabled></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="isLa_Lmt">
          <th mat-header-cell *matHeaderCellDef>LA/LMT</th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox [checked]="element.isLa_Lmt" disabled></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="ptColor">
          <th mat-header-cell *matHeaderCellDef>PT Color</th>
          <td mat-cell *matCellDef="let element">{{ element.ptColor }}</td>
        </ng-container>

        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef>Delete</th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              color="warn"
              *ngIf="kalanisession.currentUser?.isAdmin"
              (click)="deleteUser(element)"
              matTooltip="Delete User"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayColumns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</jimgcard>
