<jimgcard heading="Member Card">
  <div toolbar class="toolbar">
    <button mat-icon-button aria-label="Close" (click)="printCard()">
      <mat-icon>print</mat-icon>
    </button>
    <button mat-icon-button aria-label="Close" (click)="dialogRef.close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div  style="margin:0"   #membercard
  >
  <div
    style="
      width: 3.25in;
      height: 2.0in;
      border: 1px;
      box-sizing: border-box;
      border-style: solid;
 margin: 0px;
    "
  >
    <div
      style="
        display: flex;
        align-items: center;
        justify-content: safe;
        margin-bottom: 5px;
        font-weight: 600;
        border: 1px;
      "
    >
      <img style="height: 30px" src="assets/images/Logo-leftSM.png" />
      <div>Kalani ADHC</div>
    </div>
    <hr />
    <div
      style="
        display: flex;
        align-items: center;
        margin-bottom: 5px;
        gap: 15px;
        font-size: 14px;
        font-weight: 600;
      "
    >
      <img
        style="
          height: 100px;
          width: 100px;
          flex-shrink: 0;
          border-radius: 50%;
          background-size: cover;
          object-fit: cover;
          padding: 5px;
        "
        src="{{ member.avatar }}"
      />
      <div>{{ member.firstName }} {{ member.lastName }} <br /></div>
    </div>
    <div style=" display: flex; justify-content: center; align-items: center;"><img src="{{ member.barcode }}" /></div>
  </div>
  </div>
  <iframe #printIframe style="display: none"></iframe>
</jimgcard>
