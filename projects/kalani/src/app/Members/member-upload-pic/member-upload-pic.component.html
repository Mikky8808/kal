<jimgcard *ngIf="Ready" heading="{{ data.name }}">
  <div toolbar class="toolbar">
    <button
      (click)="onSave()"
      [disabled]="form.invalid"
      mat-mini-fab
      color="primary"
    >
      <mat-icon>file_upload</mat-icon>
    </button>
   
    <button mat-icon-button aria-label="Close" (click)="onClose()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="content">
      <div class="row">
        <mat-form-field style="min-width: 250px">
          <ngx-mat-file-input
            formControlName="avatarpic"
            [multiple]="false"
            accept="image/*"
            color="primary"
          >
            <mat-icon ngxMatFileInputIcon>image</mat-icon>
          </ngx-mat-file-input>
          <mat-error>Select Image to upload</mat-error>
        </mat-form-field>

        <button
  type="submit"
  #submitButton
  mat-raised-button
  color="primary"
  [disabled]="form.invalid"
  style="margin-right: 8px;"
>
  <mat-icon>file_upload</mat-icon>
  Upload
</button>
 <button
      mat-raised-button
      color="warn"
      (click)="removePhoto()"
    >
      <mat-icon>delete</mat-icon>
      Remove Photo
    </button>
        
        <div *ngIf="uploading">Loaded {{ this.loaded }} of {{ total }}</div>
        <div *ngIf="uploading" style="flex:1">
          <mat-progress-bar
            mode="determinate"
            [value]="progress"
          ></mat-progress-bar>
        </div>
      </div>
    </div>
  </form>

  <!-- Cropper.js integration -->
  <div class="row" style="max-width: 500px;">
    <img #imageCropper [src]="imgSrc" *ngIf="imgSrc" style="max-width:100%;" />
    <button *ngIf="imgSrc" mat-raised-button color="primary" (click)="cropImage()">Crop</button>
    <img *ngIf="croppedImgSrc" [src]="croppedImgSrc" style="max-width:100%;margin-top:10px;" />
  </div>
</jimgcard>
