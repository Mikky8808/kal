<jimgcard [heading]="'LUNCH: ' + heading?.title">
  <div toolbar class="toolbar">

    <button   mat-mini-fab color="primary"
    (click)="onLunchMenuType()"
    >
      <mat-icon>lunch_dining</mat-icon>
  </button>

    <button
    mat-icon-button
    (click)="Print=true;"
  >
    <mat-icon>print</mat-icon>
  </button>
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>preview</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <!-- <button mat-menu-item (click)="changeView(bar.view) " *ngFor ='let bar of CALTOOLBARVIEW'>{{bar.name}}</button> -->
      <mat-button-toggle-group [vertical]="true" style="width: 98%">
        <mat-button-toggle
          (click)="changeView(bar.view)"
          *ngFor="let bar of CALTOOLBARVIEW"
          >{{ bar.name }}</mat-button-toggle
        >
      </mat-button-toggle-group>
    </mat-menu>

    <button
      mat-icon-button
      (click)=" calendar.getApi().today();"
    >
      <mat-icon>calendar_today</mat-icon>
    </button>
    <button
      mat-icon-button
      (click)="calendar.getApi().removeAllEvents();   calendar.getApi().prev();"
    >
      <mat-icon>navigate_before</mat-icon>
    </button>
    <button
      mat-icon-button
      (click)="calendar.getApi().removeAllEvents(); calendar.getApi().next();"
    >
      <mat-icon>navigate_next</mat-icon>
    </button>
  </div>

  <full-calendar #calendar [options]="calendarOptions" >
    <ng-template #eventContent let-arg>

      <a *ngIf="arg.event.extendedProps.status==99"
        (click)="openLunchDialog({start: arg.event.start})"
        [ngStyle]="{ 'background-color': arg.backgroundColor }"
        class="eventbtn _{{arg.event.extendedProps.status}}"
        mat-stroked-button
   
      >
        <div class="btntext"  >
          <mat-icon>{{ arg.event.extendedProps.statusIcon }}</mat-icon>
          <span
            matTooltip="{{ arg.event.extendedProps.guestNames }}"
            *ngIf="arg.event.extendedProps.guests > 0"
          >
            {{ arg.event.extendedProps.guests }}
          </span>

          <mat-icon
            matTooltip="{{ arg.event.extendedProps.guestNames }}"
            *ngIf="arg.event.extendedProps.guests > 0"
            >group</mat-icon
          >

          <span class="status_{{arg.event.extendedProps.status}}"> {{ arg.event.title }}</span>
        </div>
      </a>
      <a *ngIf="arg.event.extendedProps.status!=99"
   
      [ngStyle]="{ 'background-color': arg.backgroundColor }"
      class="eventbtn _{{arg.event.extendedProps.status}}"
      mat-stroked-button
      #menuTrigger="matMenuTrigger"
      [matMenuTriggerFor]="eventmenu"
      [matMenuTriggerData]="getEventinfo(arg)"
      (menuOpened)="isMenuOpen=true"
      (menuClosed)="isMenuOpen=false"
      [disabled]="arg.event.extendedProps.status==99"
    >
      <div class="btntext"  >
        <mat-icon>{{ arg.event.extendedProps.statusIcon }}</mat-icon>
        <span
          matTooltip="{{ arg.event.extendedProps.guestNames }}"
          *ngIf="arg.event.extendedProps.guests > 0"
        >
          {{ arg.event.extendedProps.guests }}
        </span>

        <mat-icon
          matTooltip="{{ arg.event.extendedProps.guestNames }}"
          *ngIf="arg.event.extendedProps.guests > 0"
          >group</mat-icon
        >

        <span class="status_{{arg.event.extendedProps.status}}"> {{ arg.event.title }}</span>
      </div>
    </a>
    </ng-template>
  </full-calendar>
  <!-- <div *ngIf="Print" id="loading"><mat-icon>print</mat-icon></div> -->
</jimgcard>

<app-lunch-print (onAfterPrint)="Print=!Print" *ngIf="Print" [dataSource]="dataSource"></app-lunch-print>

<!-- <mat-menu #eventmenu="matMenu" (menuOpened)='menuOpened(true)' (menuClosed)='menuOpened(false)')> -->
<mat-menu #eventmenu="matMenu">
  <ng-template matMenuContent let-data="data" >
    <button mat-menu-item (click)="openLunchDialog(data)">
      <mat-icon>edit</mat-icon>
      <div class="evName">{{ data.name }} </div>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="kalanisession.QVMember$.next(data.memberId)">
      <mat-icon>preview</mat-icon>
      <div class="evName">Quick View </div>
    </button>
    <mat-divider></mat-divider>
    <ng-container *ngIf="data.status < 20 && !data.isFuture">
      <ng-container *ngFor="let stat of ptStatus">
        <button
          *ngIf="stat.qm"
          mat-menu-item
          (click)="updateStatus({ status: stat.status, id: data.id })"
          [disabled]="data.status == stat.status"
        >
          <mat-icon>{{ stat.statusIcon }}</mat-icon>
          <span>{{ stat.statusText }}</span>
        </button>
        <mat-divider></mat-divider>
      </ng-container>
    </ng-container>
    <button
    mat-menu-item
    (click)="onDelete(data.id )"
   >
    <mat-icon>delete</mat-icon>
    <span>Delete</span>
  </button>
  </ng-template>
</mat-menu>
