<jimgcard [heading]="'ACCU/MASSAGE: ' + heading?.title">
  <div toolbar class="toolbar">
    
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>preview</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
      <!-- <button mat-menu-item (click)="changeView(bar.view) " *ngFor ='let bar of CALTOOLBARVIEW'>{{bar.name}}</button> -->
      <mat-button-toggle-group [vertical]="true" style="width: 98%">
        <mat-button-toggle
          (click)="changeView(bar.view)"
          *ngFor="let bar of CALTOOLBARVIEW"
          >{{ bar.name }}</mat-button-toggle
        >
      </mat-button-toggle-group>
    </mat-menu>

    <button mat-icon-button (click)="calendar.getApi().today()">
      <mat-icon>calendar_today</mat-icon>
    </button>
    <button
      mat-icon-button
      (click)="calendar.getApi().removeAllEvents(); calendar.getApi().prev()"
    >
      <mat-icon>navigate_before</mat-icon>
    </button>
    <button
      mat-icon-button
      (click)="calendar.getApi().removeAllEvents(); calendar.getApi().next()"
    >
      <mat-icon>navigate_next</mat-icon>
    </button>
  </div>

  <full-calendar #calendar [options]="calendarOptions">
    <ng-template #eventContent let-arg>
      <a
        *ngIf="arg.view.type != 'multiMonthYear'"
        [ngStyle]="{ 'background-color': arg.backgroundColor }"
        class="eventbtn"
        mat-button
        #menuTrigger="matMenuTrigger"
        [matMenuTriggerFor]="eventmenu"
        [matMenuTriggerData]="getEventinfo(arg)"
        (menuOpened)="isMenuOpen = true"
        (menuClosed)="isMenuOpen = false"
        ><span
          *ngIf="arg.event.extendedProps.blocked != true"
          class="timetxt"
          >{{ arg.timeText }}</span
        ><br *ngIf="arg.event.extendedProps.blocked != true" />
        <span class="btntext">
          <mat-icon>{{ arg.event.extendedProps.statusIcon }}</mat-icon>

          <mat-icon *ngIf="arg.event.extendedProps.blocked == true"
            >block</mat-icon
          >
          <mat-icon *ngIf="arg.event.extendedProps.reserveRide == 'Y'"
            >directions_car</mat-icon
          >
          <mat-icon *ngIf="arg.event.extendedProps.wheelChair"
            >accessible</mat-icon
          >

          <span> {{ arg.event.title }}</span>
        </span>
      </a>
      <a
        *ngIf="arg.view.type == 'multiMonthYear'"
        [ngStyle]="{ 'background-color': arg.backgroundColor }"
        class="eventbtn"
        (click)="editAppt(getEventinfo(arg).data)"
        mat-button
        ><span class="timetxt">{{ arg.timeText }}</span
        ><br />
        <span class="btntext">
          <mat-icon>{{ arg.event.extendedProps.statusIcon }}</mat-icon>
          <span> {{ arg.event.title }}</span>
        </span>
      </a>
      <!-- <div
        *ngIf="arg.view.type == 'timeGridDay'"
        [ngStyle]="{ 'background-color': arg.backgroundColor }"
        class="eventbtn"
        mat-button
      >
      <mat-checkbox class="checkin"
      (click)="updateStatus({ status: 10, id: arg.event.extendedProps.apptsID})"
        *ngIf="arg.event.extendedProps.status == 0"
        color="warn"
        style="flex: 1; color: black; max-width:45px"
        ><span style="color: black"></span></mat-checkbox
      >
        <span class="btntext" style="flex:1">
          <mat-icon>{{ arg.event.extendedProps.statusIcon }}</mat-icon>
          <span style="padding: 5px"> {{ arg.event.title }}</span>
        </span>

      </div> -->
    </ng-template>
  </full-calendar>
</jimgcard>
<!-- <mat-menu #eventmenu="matMenu" (menuOpened)='menuOpened(true)' (menuClosed)='menuOpened(false)')> -->

<mat-menu #eventmenu="matMenu">
  <ng-template matMenuContent let-data="data">
    <ng-container *ngIf="!data?.blocked">
      <button mat-menu-item (click)="editAppt(data)">
        <mat-icon>edit</mat-icon>
        <div class="evName">({{ data.timeText }}) <br />{{ data.name }}</div>
      </button>
      <mat-divider></mat-divider>
      <mat-divider></mat-divider>
      <button
        mat-menu-item
        (click)="kalanisession.QVMember$.next(data.memberId)"
      >
        <mat-icon>preview</mat-icon>
        <div class="evName">Quick View</div>
      </button>
      <mat-divider></mat-divider>
      <ng-container *ngIf="data.status < 20 && (data.isToday || data.isPast)">
        <ng-container *ngFor="let stat of ptStatus">
          <button
            *ngIf="stat.qm"
            mat-menu-item
            (click)="updateStatus({ status: stat.status, id: data.id })"
            [disabled]="data.status == stat.status"
          >
            <mat-icon>{{ stat.statusIcon }}</mat-icon>
            <span>{{ stat.statusText }}</span>
          </button>
          <mat-divider></mat-divider>
        </ng-container>
      </ng-container>
      <button mat-menu-item (click)="delteAppt(data.id)">
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
      </button>
    </ng-container>
    <ng-container *ngIf="data?.blocked">
      <button mat-menu-item (click)="onDeleteBlocked(data)">
        <mat-icon>delete</mat-icon>
        <div class="evName">({{ data.timeText }}) <br />{{ data.name }}</div>
      </button>
    </ng-container>
  </ng-template>
</mat-menu>
